# 持续集成：静态检查、离线测试（DynamoDB Local）、浏览器旅程、构建并校验制品。
# Action 固定到 commit（2026-10-04 查询）；升级时同时更新注释中的版本号。
name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    services:
      dynamodb:
        image: amazon/dynamodb-local:latest
        ports: ["8000:8000"]
    env:
      DYNAMODB_ENDPOINT: http://localhost:8000
      LEDGER_ENV: local
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: pnpm
      - run: uv sync --frozen
      - run: pnpm install --frozen-lockfile
      - name: 静态检查与离线测试
        run: scripts/check.sh
      - name: CDK 断言
        run: pnpm --filter @family-ledger/infra test
      - name: 浏览器旅程（本地替身，离线证据）
        run: |
          pnpm --filter @family-ledger/frontend exec playwright install --with-deps chromium
          pnpm --filter @family-ledger/frontend exec playwright test
      - name: 构建制品
        run: |
          uv run python scripts/build_lambda.py
          uv run python scripts/verify_artifact.py dist/lambda.zip dist/manifest.json --expect-commit "${GITHUB_SHA}"
          pnpm --filter @family-ledger/frontend build
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: release-${{ github.sha }}
          path: |
            dist/lambda.zip
            dist/manifest.json
            frontend/dist
          retention-days: 30
