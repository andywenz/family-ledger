openapi: 3.1.0
info:
  title: 小家账本 API
  version: 0.1.0
  description: |
    家庭记账本用户 API 与飞书回调。D0 契约基线（2026-10-04）。

    通用规则（工程契约 §2，ADR-0008／0010）：
    - 所有 `/v1` 业务接口需要 `Authorization: Bearer <access token>`；服务端在每次请求与提交事务时检查账号状态、会话边界与家庭成员关系。
    - 所有写操作（POST／PATCH／DELETE，认证入口与飞书回调除外）必须携带 `Idempotency-Key`。同 key 同指纹返回原结果；同 key 不同正文返回 409 `idempotency_key_reused`。响应丢失时先 `GET .../actions/{key}`，不得换 key 重试。
    - 修改、删除、恢复、确认携带 `expected_version`；不匹配返回 409 `version_conflict` 及调用者有权查看的当前版本。
    - 金额一律为十进制字符串；`*_minor` 为整数分值。前端不得自行累计金融数值。
    - 时间为 UTC ISO-8601；`business_date` 为家庭时区日历日期 `YYYY-MM-DD`。
    - 扩展字段：`x-authz` 权限要求；`x-idempotent` 是否需要 Idempotency-Key；`x-versioned` 是否需要 expected_version；`x-acceptance` 关联验收 ID。

    `x-authz` 取值：`public`、`authenticated`（已登录且无需改密）、`pre_auth`（认证流程）、`self`、`member`、`family_admin`、`owner_or_admin`（本人或家庭管理员）、`candidate_owner`、`system_admin`、`feishu_signature`。
servers:
  - url: https://api.ledger.example.com/v1
    description: 生产（实际域名在私人配置中）
  - url: http://localhost:8787/v1
    description: 本地开发（LEDGER_ENV=local）

security:
  - bearerAuth: []

tags:
  - name: auth
  - name: me
  - name: admin
  - name: families
  - name: entries
  - name: categories
  - name: rates
  - name: attachments
  - name: ai
  - name: feishu
  - name: ops

paths:
  /health:
    get:
      tags: [ops]
      operationId: getHealth
      summary: 健康检查与部署版本读回
      security: []
      x-authz: public
      x-idempotent: false
      x-acceptance: [OPS-08]
      responses:
        default: { $ref: "#/components/responses/Default" }
        "200":
          description: 正常
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }

  # ───────────────────────── 认证 ─────────────────────────
  /auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: 登录名＋密码登录
      description: 登录名不区分大小写，经应用映射为内部 ID 后交给身份服务。首次或重置后登录返回改密挑战。密码不写日志。成功时以 Secure／HttpOnly cookie 下发 refresh token，并下发 CSRF cookie。
      security: []
      x-authz: pre_auth
      x-idempotent: false
      x-acceptance: [AUTH-01, AUTH-02, AUTH-03]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        default: { $ref: "#/components/responses/Default" }
        "200":
          description: 登录成功或需要改密
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginResult" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /auth/challenge:
    post:
      tags: [auth]
      operationId: respondChallenge
      summary: 完成首次登录／重置后的强制改密
      security: []
      x-authz: pre_auth
      x-idempotent: false
      x-acceptance: [AUTH-01, AUTH-03]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChallengeRequest" }
      responses:
        default: { $ref: "#/components/responses/Default" }
        "200":
          description: 改密成功并登录
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginResult" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /auth/refresh:
    post:
      tags: [auth]
      operationId: refresh
      summary: 用 refresh cookie 换取新的 access token
      description: 校验 Origin 与 `X-CSRF-Token`（双提交 cookie）。账号会话边界之前签发的 refresh 拒绝。
      security: []
      x-authz: pre_auth
      x-idempotent: false
      x-acceptance: [AUTH-03]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        default: { $ref: "#/components/responses/Default" }
        "200":
          description: 新 access token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenResult" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: 退出并撤销当前 refresh session
      security: []
      x-authz: pre_auth
      x-idempotent: false
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        default: { $ref: "#/components/responses/Default" }
        "204": { description: 已退出 }
        "403": { $ref: "#/components/responses/Forbidden" }

  # ───────────────────────── 自己账号 ─────────────────────────
  /me:
    get:
      tags: [me]
      operationId: getMe
      summary: 当前账号、所属家庭与飞书绑定状态
      x-authz: authenticated
      x-idempotent: false
      responses:
        default: { $ref: "#/components/responses/Default" }
        "200":
          description: 当前账号
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
  /me/profile:
    patch:
      tags: [me]
      operationId: updateMyProfile
      summary: 修改显示名（ADR-0005）
      x-authz: self
      x-idempotent: true
      x-versioned: true
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [display_name, expected_version]
              properties:
                display_name: { $ref: "#/components/schemas/DisplayName" }
                expected_version: { $ref: "#/components/schemas/Version" }
      responses:
        "401": { $ref: "#/components/responses/Unauthenticated" }
        default: { $ref: "#/components/responses/Default" }
        "200":
          description: 已更新
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /me/login-name:
    patch:
      tags: [me]
      operationId: changeLoginName
      summary: 修改登录名
      description: 唯一性预留→更新身份服务别名→完成映射；跨服务步骤以 rename 操作记录。可能同步完成（200）或返回 pending（202），pending 期间用旧登录名仍可登录。
      x-authz: self
      x-idempotent: true
      x-versioned: true
      x-acceptance: [AUTH-02]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [new_login_name, expected_version]
              properties:
                new_login_name: { $ref: "#/components/schemas/LoginName" }
                expected_version: { $ref: "#/components/schemas/Version" }
      responses:
        "401": { $ref: "#/components/responses/Unauthenticated" }
        default: { $ref: "#/components/responses/Default" }
        "200":
          description: 已完成
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RenameOperation" }
        "202":
          description: 处理中
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RenameOperation" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /me/login-name/operations/{op_id}:
    get:
      tags: [me]
      operationId: getRenameOperation
      summary: 查询改名操作进度
      x-authz: self
      x-idempotent: false
      x-acceptance: [AUTH-02]
      parameters:
        - name: op_id
          in: path
          required: true
          schema: { $ref: "#/components/schemas/Id" }
      responses:
        "401": { $ref: "#/components/responses/Unauthenticated" }
        default: { $ref: "#/components/responses/Default" }
        "200":
          description: 操作状态
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RenameOperation" }
        "404": { $ref: "#/components/responses/NotFound" }
  /me/password:
    post:
      tags: [me]
      operationId: changeMyPassword
      summary: 修改密码；成功后撤销其他会话并暂停飞书写入授权直至重新验证
      x-authz: self
      x-idempotent: true
      x-acceptance: [AUTH-03]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [current_password, new_password]
              properties:
                current_password: { type: string, writeOnly: true, minLength: 1, maxLength: 256 }
                new_password: { type: string, writeOnly: true, minLength: 10, maxLength: 256 }
      responses:
        default: { $ref: "#/components/responses/Default" }
        "204": { description: 已修改，返回新的 refresh cookie }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /me/invitations:
    get:
      tags: [me]
      operationId: listMyInvitations
      summary: 我收到的待处理邀请
      x-authz: self
      x-idempotent: false
      responses:
        "401": { $ref: "#/components/responses/Unauthenticated" }
        default: { $ref: "#/components/responses/Default" }
        "200":
          description: 邀请列表
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Invitation" }
  /me/actions/{action_id}:
    get:
      tags: [me]
      operationId: getMyAction
      summary: 查询账号级动作（创建家庭、改名、改资料等）回执
      x-authz: self
      x-idempotent: false
      x-acceptance: [OPS-01]
      parameters:
        - $ref: "#/components/parameters/ActionId"
      responses:
        "401": { $ref: "#/components/responses/Unauthenticated" }
        default: { $ref: "#/components/responses/Default" }
        "200":
          description: 已提交的回执
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActionReceipt" }
        "404":
          description: 未提交（可用同一 key 与同一正文安全重试）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /me/feishu-binding-code:
    post:
      tags: [me, feishu]
      operationId: createFeishuBindingCode
      summary: 生成一次性飞书绑定码（10 分钟有效）
      x-authz: self
      x-idempotent: true
      x-acceptance: [FS-01]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [default_family_id]
              properties:
                default_family_id: { $ref: "#/components/schemas/Id" }
      responses:
        "401": { $ref: "#/components/responses/Unauthenticated" }
        default: { $ref: "#/components/responses/Default" }
        "201":
          description: 绑定码（仅本次返回明文）
          content:
            application/json:
              schema:
                type: object
                required: [code, expires_at]
                properties:
                  code: { type: string, pattern: "^[A-Z0-9]{8}$" }
                  expires_at: { $ref: "#/components/schemas/Timestamp" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /me/feishu-binding:
    patch:
      tags: [me, feishu]
      operationId: updateFeishuBinding
      summary: 修改飞书默认家庭
      x-authz: self
      x-idempotent: true
      x-versioned: true
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [default_family_id, expected_version]
              properties:
                default_family_id: { $ref: "#/components/schemas/Id" }
                expected_version: { $ref: "#/components/schemas/Version" }
      responses:
        "401": { $ref: "#/components/responses/Unauthenticated" }
        default: { $ref: "#/components/responses/Default" }
        "200":
          description: 已更新
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FeishuBinding" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      tags: [me, feishu]
      operationId: deleteFeishuBinding
      summary: 解除飞书绑定
      x-authz: self
      x-idempotent: true
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "401": { $ref: "#/components/responses/Unauthenticated" }
        default: { $ref: "#/components/responses/Default" }
        "204": { description: 已解除 }

  # ───────────────────────── 系统管理 ─────────────────────────
  /admin/users:
    get:
      tags: [admin]
      operationId: listUsers
      summary: 全站账号列表（不含家庭账目）
      x-authz: system_admin
      x-idempotent: false
      responses:
        "401": { $ref: "#/components/responses/Unauthenticated" }
        default: { $ref: "#/components/responses/Default" }
        "200":
          description: 账号列表
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/AdminUser" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [admin]
      operationId: createUser
      summary: 创建个人账号；返回一次性临时密码
      x-authz: system_admin
      x-idempotent: true
      x-acceptance: [AUTH-01, AUTH-04]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [login_name, display_name]
              properties:
                login_name: { $ref: "#/components/schemas/LoginName" }
                display_name: { $ref: "#/components/schemas/DisplayName" }
                is_system_admin: { type: boolean, default: false }
      responses:
        "401": { $ref: "#/components/responses/Unauthenticated" }
        default: { $ref: "#/components/responses/Default" }
        "201":
          description: 已创建。临时密码仅此响应返回一次，重放返回 `temporary_password_redacted`
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TemporaryPasswordResult" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /admin/users/{uid}:
    patch:
      tags: [admin]
      operationId: updateUserStatus
      summary: 停用或启用账号（停用立即使会话与飞书授权失效）
      x-authz: system_admin
      x-idempotent: true
      x-versioned: true
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [status, expected_version]
              properties:
                status: { type: string, enum: [active, disabled] }
                expected_version: { $ref: "#/components/schemas/Version" }
      responses:
        "401": { $ref: "#/components/responses/Unauthenticated" }
        default: { $ref: "#/components/responses/Default" }
        "200":
          description: 已更新
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUser" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /admin/users/{uid}/reset-password:
    post:
      tags: [admin]
      operationId: resetUserPassword
      summary: 重置为临时密码；旧会话与飞书写入授权失效
      x-authz: system_admin
      x-idempotent: true
      x-acceptance: [AUTH-03, AUTH-04]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/UserId"
      responses:
        "401": { $ref: "#/components/responses/Unauthenticated" }
        default: { $ref: "#/components/responses/Default" }
        "200":
          description: 临时密码仅此响应返回一次
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TemporaryPasswordResult" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /admin/currencies:
    post:
      tags: [admin, rates]
      operationId: createGlobalCurrency
      summary: 新增全局币种元数据（ADR-0004）
      x-authz: system_admin
      x-idempotent: true
      x-acceptance: [FX-03]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Currency" }
      responses:
        "401": { $ref: "#/components/responses/Unauthenticated" }
        default: { $ref: "#/components/responses/Default" }
        "201":
          description: 已创建
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Currency" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /admin/costs:
    get:
      tags: [admin, ops]
      operationId: getCosts
      summary: 本系统费用：应用估算、未知 usage、账单同步值分开展示
      x-authz: system_admin
      x-idempotent: false
      x-acceptance: [OPS-05, OPS-06]
      parameters:
        - $ref: "#/components/parameters/MonthQuery"
      responses:
        "401": { $ref: "#/components/responses/Unauthenticated" }
        default: { $ref: "#/components/responses/Default" }
        "200":
          description: 月度费用
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CostSummary" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /admin/alerts:
    get:
      tags: [admin, ops]
      operationId: listAlerts
      summary: 预算告警与交付状态
      x-authz: system_admin
      x-idempotent: false
      x-acceptance: [OPS-05, OPS-06]
      parameters:
        - $ref: "#/components/parameters/MonthQuery"
      responses:
        "401": { $ref: "#/components/responses/Unauthenticated" }
        default: { $ref: "#/components/responses/Default" }
        "200":
          description: 告警列表
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Alert" }
        "403": { $ref: "#/components/responses/Forbidden" }

  # ───────────────────────── 家庭与成员 ─────────────────────────
  /families:
    get:
      tags: [families]
      operationId: listFamilies
      summary: 当前账号所属家庭
      x-authz: authenticated
      x-idempotent: false
      responses:
        "401": { $ref: "#/components/responses/Unauthenticated" }
        default: { $ref: "#/components/responses/Default" }
        "200":
          description: 家庭列表
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/FamilySummary" }
    post:
      tags: [families]
      operationId: createFamily
      summary: 创建家庭；创建者成为家庭管理员，按模板生成分类目录
      x-authz: authenticated
      x-idempotent: true
      x-acceptance: [AUTH-05]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 40 }
                timezone: { type: string, default: Pacific/Auckland, maxLength: 64 }
                default_currency: { $ref: "#/components/schemas/CurrencyCode" }
                default_payment_method: { $ref: "#/components/schemas/PaymentMethod" }
      responses:
        "401": { $ref: "#/components/responses/Unauthenticated" }
        default: { $ref: "#/components/responses/Default" }
        "201":
          description: 已创建
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Family" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /families/{fid}:
    parameters:
      - $ref: "#/components/parameters/FamilyId"
    get:
      tags: [families]
      operationId: getFamily
      x-authz: member
      x-idempotent: false
      responses:
        "401": { $ref: "#/components/responses/Unauthenticated" }
        default: { $ref: "#/components/responses/Default" }
        "200":
          description: 家庭
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Family" }
        "403": { $ref: "#/components/responses/Forbidden" }
    patch:
      tags: [families]
      operationId: renameFamily
      x-authz: family_admin
      x-idempotent: true
      x-versioned: true
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, expected_version]
              properties:
                name: { type: string, minLength: 1, maxLength: 40 }
