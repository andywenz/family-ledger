        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [items]
              properties:
                items:
                  type: array
                  minItems: 1
                  maxItems: 10
                  uniqueItems: true
                  items:
                    type: object
                    additionalProperties: false
                    required: [candidate_id, version, content_digest]
                    properties:
                      candidate_id: { $ref: "#/components/schemas/Id" }
                      version: { $ref: "#/components/schemas/Version" }
                      content_digest: { $ref: "#/components/schemas/Digest" }
      responses:
        "401": { $ref: "#/components/responses/Unauthenticated" }
        default: { $ref: "#/components/responses/Default" }
        "200":
          description: 已入账
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConfirmResult" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "410": { $ref: "#/components/responses/Gone" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  # ───────────────────────── 飞书回调 ─────────────────────────
  /integrations/feishu/events:
    post:
      tags: [feishu]
      operationId: feishuEvents
      summary: 飞书事件订阅回调（URL 验证、私聊消息）
      description: 不使用用户 JWT。验签／解密／防重放、校验应用与租户、仅处理私聊；未绑定账号不调用模型、不下载资源。精确协议在 D4 依官方文档核实后锁定。
      security: []
      x-authz: feishu_signature
      x-idempotent: false
      x-acceptance: [FS-01, FS-02, FS-03, FS-06]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, description: 飞书平台事件体（D4 锁定） }
      responses:
        default: { $ref: "#/components/responses/Default" }
        "200":
          description: 已接收（或 URL 验证响应）
          content:
            application/json:
              schema: { type: object }
        "401": { description: 签名无效 }
  /integrations/feishu/cards:
    post:
      tags: [feishu]
      operationId: feishuCardActions
      summary: 飞书卡片交互回调（字段编辑、父分类联动、确认、取消）
      description: 操作者由平台可信字段确定，回调中的 family ID、隐藏值不作为身份依据。确认走与网站相同的确认用例与回执。
      security: []
      x-authz: feishu_signature
      x-idempotent: false
      x-acceptance: [FS-04, FS-05, FS-06, FS-07, AUTH-08, AUTH-10]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, description: 飞书卡片回调体（D4 锁定） }
      responses:
        default: { $ref: "#/components/responses/Default" }
        "200":
          description: 卡片更新或 toast
          content:
            application/json:
              schema: { type: object }
        "401": { description: 签名无效 }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 稳定动作 ID；客户端在发起动作时生成并在重试中复用
      schema: { type: string, pattern: "^[A-Za-z0-9_-]{16,64}$" }
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema: { type: string, minLength: 16, maxLength: 128 }
    ActionId:
      name: action_id
      in: path
      required: true
      schema: { type: string, pattern: "^[A-Za-z0-9_-]{16,64}$" }
    FamilyId:
      name: fid
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Id" }
    UserId:
      name: uid
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Id" }
    EntryId:
      name: eid
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Id" }
    CategoryId:
      name: cid
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Id" }
    InvitationId:
      name: iid
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Id" }
    AttachmentId:
      name: aid
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Id" }
    JobId:
      name: jid
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Id" }
    BatchId:
      name: bid
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Id" }
    CandidateId:
      name: cid
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Id" }
    ExpectedVersionQuery:
      name: expected_version
      in: query
      required: true
      schema: { $ref: "#/components/schemas/Version" }
    MonthRequired:
      name: month
      in: query
      required: true
      schema: { $ref: "#/components/schemas/Month" }
    MonthQuery:
      name: month
      in: query
      required: false
      description: 省略为当前月（Pacific/Auckland）
      schema: { $ref: "#/components/schemas/Month" }
    FilterCreatedBy:
      name: created_by
      in: query
      required: false
      schema: { $ref: "#/components/schemas/Id" }
    FilterType:
      name: type
      in: query
      required: false
      schema: { $ref: "#/components/schemas/EntryType" }
    FilterCategory:
      name: category_id
      in: query
      required: false
      description: 一级或叶子分类 ID（按当前目录与重定向解析）
      schema: { $ref: "#/components/schemas/Id" }
    FilterPaymentMethod:
      name: payment_method
      in: query
      required: false
      schema: { $ref: "#/components/schemas/PaymentMethod" }
    PageSize:
      name: page_size
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
    Cursor:
      name: cursor
      in: query
      required: false
      description: 不透明游标，绑定查询条件与 data_version
      schema: { type: string, maxLength: 2048 }

  responses:
    Unauthenticated:
      description: 未登录、token 失效或会话已被撤销（error.code=unauthenticated／password_change_required）
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: 无权限；不泄露对象是否存在及内容
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: 不存在
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: 版本冲突／幂等 key 重用／业务冲突；details.current 为调用者有权查看的当前版本
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Gone:
      description: 已过期（candidate_expired、invitation_expired、purged）
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ValidationFailed:
      description: 业务字段错误；details.fields 指出字段
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    UnsupportedMedia:
      description: 不支持的文件格式
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Default:
      description: 其他错误（403／404／409／410／422／429／500／503 等）；统一 Error 结构。503 upstream_unknown 表示结果未知，须按动作 ID 查询
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    RateLimited:
      description: 速率限制；Retry-After 头给出秒数
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    # ── 基础类型 ──
    Id:
      type: string
      pattern: "^[A-Za-z0-9_-]{1,64}$"
    Version:
      type: integer
      minimum: 1
    Timestamp:
      type: string
      format: date-time
      description: UTC ISO-8601
    BusinessDate:
      type: string
      format: date
      pattern: "^\\d{4}-\\d{2}-\\d{2}$"
    Month:
      type: string
      pattern: "^\\d{4}-(0[1-9]|1[0-2])$"
    Digest:
      type: string
      pattern: "^[a-f0-9]{64}$"
    Amount:
      type: string
      description: 正十进制字符串；小数位不得超过币种 minor_digits；不接受指数、符号、NaN
      pattern: "^(0|[1-9][0-9]{0,11})(\\.[0-9]{1,3})?$"
    Decimal:
      type: string
      description: 可为负的十进制字符串（统计值）
      pattern: "^-?[0-9]+(\\.[0-9]+)?$"
    RateValue:
      type: string
      description: 一单位币种可兑换的 USD，正十进制字符串，不截断
      pattern: "^(0|[1-9][0-9]{0,9})(\\.[0-9]{1,20})?$"
    CurrencyCode:
      type: string
      pattern: "^[A-Z]{3}$"
    LoginName:
      type: string
      pattern: "^[A-Za-z][A-Za-z0-9_.-]{2,31}$"
      description: 唯一，不区分大小写
    DisplayName:
      type: string
      minLength: 1
      maxLength: 24
    Note:
      type: string
      maxLength: 200
    CategoryName:
      type: string
      minLength: 1
      maxLength: 24
    EntryType:
      type: string
      enum: [expense, income, refund, internal_transfer, exchange, card_repayment, receivable]
    PaymentMethod:
      type: string
      enum: [credit_card, debit_card, cash]
    CategoryKind:
      type: string
      enum: [expense, income, internal_transfer, exchange, card_repayment, receivable]
    FamilyRole:
      type: string
      enum: [admin, member]
    EntrySource:
      type: string
      enum: [manual, web_ai, feishu, import]
    MoneyPair:
      type: object
      required: [nzd, cny, nzd_minor, cny_minor]
      properties:
        nzd: { $ref: "#/components/schemas/Decimal" }
        cny: { $ref: "#/components/schemas/Decimal" }
        nzd_minor: { type: integer }
        cny_minor: { type: integer }

    # ── 错误 ──
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, request_id]
          properties:
            code:
              type: string
              enum:
                - unauthenticated
                - password_change_required
                - csrf_failed
                - forbidden
                - not_found
                - validation_failed
                - version_conflict
                - idempotency_key_reused
                - action_not_found
                - candidate_expired
                - candidate_stale
                - batch_too_large
                - rate_pending
                - refund_exceeds_remaining
                - refund_currency_mismatch
                - refund_target_invalid
                - has_linked_refunds
                - type_change_not_allowed
                - category_kind_mismatch
                - category_inactive
                - category_in_use
                - category_cycle
                - last_admin
                - login_name_taken
                - rename_pending
                - invitation_expired
                - purged
                - data_changing
                - data_changed
                - unsupported_media_type
                - upload_invalid
                - rate_limited
                - upstream_unknown
                - integration_not_configured
                - internal
            message: { type: string, description: 中文用户可读信息，不含他人对象内容 }
            request_id: { type: string }
            details:
              type: object
              description: 脱敏细节，如 fields、current、retry_after
              properties:
                fields:
                  type: array
                  items:
                    type: object
                    required: [field, code]
                    properties:
                      field: { type: string }
                      code: { type: string }
                current: { description: 调用者有权查看的当前资源 }

    Health:
      type: object
      required: [status, version, commit, artifact_digest, env]
      properties:
        status: { type: string, enum: [ok] }
        version: { type: string }
        commit: { type: string }
        artifact_digest: { type: string }
        env: { type: string, enum: [local, staging, prod] }

    # ── 认证与账号 ──
    LoginRequest:
      type: object
      additionalProperties: false
      required: [login_name, password]
      properties:
        login_name: { type: string, minLength: 1, maxLength: 64 }
        password: { type: string, writeOnly: true, minLength: 1, maxLength: 256 }
    ChallengeRequest:
      type: object
      additionalProperties: false
      required: [challenge_session, new_password]
      properties:
        challenge_session: { type: string, maxLength: 4096 }
        new_password: { type: string, writeOnly: true, minLength: 10, maxLength: 256 }
    LoginResult:
      oneOf:
        - $ref: "#/components/schemas/TokenResult"
        - type: object
          required: [status, challenge, challenge_session]
          properties:
            status: { const: challenge }
            challenge: { type: string, enum: [new_password_required] }
            challenge_session: { type: string }
    TokenResult:
      type: object
      required: [status, access_token, expires_in]
      properties:
        status: { const: ok }
        access_token: { type: string }
        expires_in: { type: integer, description: 秒 }
    Me:
      type: object
      required: [user_id, login_name, display_name, version, is_system_admin, families, feishu]
      properties:
        user_id: { $ref: "#/components/schemas/Id" }
        login_name: { type: string }
        display_name: { $ref: "#/components/schemas/DisplayName" }
        version: { $ref: "#/components/schemas/Version" }
        is_system_admin: { type: boolean }
        pending_rename: { $ref: "#/components/schemas/RenameOperation" }
        families:
          type: array
          items: { $ref: "#/components/schemas/FamilySummary" }
        feishu: { $ref: "#/components/schemas/FeishuBinding" }
    FeishuBinding:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [unbound, active, suspended] }
        default_family_id: { $ref: "#/components/schemas/Id" }
        bound_at: { $ref: "#/components/schemas/Timestamp" }
        version: { $ref: "#/components/schemas/Version" }
    RenameOperation:
      type: object
      required: [op_id, state, new_login_name]
      properties:
        op_id: { $ref: "#/components/schemas/Id" }
        state: { type: string, enum: [pending, done, failed] }
        new_login_name: { type: string }
        failure_code: { type: string }
    AdminUser:
      type: object
      required: [user_id, login_name, display_name, status, is_system_admin, must_change_password, version]
      properties:
        user_id: { $ref: "#/components/schemas/Id" }
        login_name: { type: string }
        display_name: { $ref: "#/components/schemas/DisplayName" }
        status: { type: string, enum: [active, disabled] }
        is_system_admin: { type: boolean }
        must_change_password: { type: boolean }
        version: { $ref: "#/components/schemas/Version" }
    TemporaryPasswordResult:
      type: object
      required: [user]
      properties:
        user: { $ref: "#/components/schemas/AdminUser" }
        temporary_password:
          type: string
          description: 仅首次响应返回；重放时省略并设置 temporary_password_redacted
        temporary_password_redacted: { type: boolean }

    # ── 家庭 ──
    FamilySummary:
      type: object
      required: [family_id, name, role]
      properties:
        family_id: { $ref: "#/components/schemas/Id" }
        name: { type: string }
        role: { $ref: "#/components/schemas/FamilyRole" }
    Family:
      type: object
      required: [family_id, name, timezone, version, member_count, my_role]
      properties:
        family_id: { $ref: "#/components/schemas/Id" }
        name: { type: string }
        timezone: { type: string }
        version: { $ref: "#/components/schemas/Version" }
        member_count: { type: integer }
        my_role: { $ref: "#/components/schemas/FamilyRole" }
    FamilyConfig:
      type: object
      required: [default_currency, default_payment_method, timezone, category_manifest_version, version, secondary_currency]
      properties:
        default_currency: { $ref: "#/components/schemas/CurrencyCode" }
        default_payment_method: { $ref: "#/components/schemas/PaymentMethod" }
        timezone: { type: string }
        category_manifest_version: { type: integer }
        version: { $ref: "#/components/schemas/Version" }
        secondary_currency:
          description: 月度总览的辅助显示币种；null 表示不显示（主币种固定为 NZD）
          type: [string, "null"]
          pattern: "^[A-Z]{3}$"
    Member:
      type: object
      required: [user_id, display_name, role, status, version]
      properties:
        user_id: { $ref: "#/components/schemas/Id" }
        display_name: { $ref: "#/components/schemas/DisplayName" }
        login_name:
          type: string
          description: 仅对 active 成员返回
        role: { $ref: "#/components/schemas/FamilyRole" }
        status: { type: string, enum: [active, removed] }
        version: { $ref: "#/components/schemas/Version" }
    Invitation:
      type: object
      required: [invitation_id, family_id, role, status, expires_at]
      properties:
        invitation_id: { $ref: "#/components/schemas/Id" }
        family_id: { $ref: "#/components/schemas/Id" }
        family_name: { type: string }
        invitee_display_name: { type: string }
        role: { $ref: "#/components/schemas/FamilyRole" }
        status: { type: string, enum: [pending, accepted, declined, revoked, expired] }
        expires_at: { $ref: "#/components/schemas/Timestamp" }

    # ── 账目 ──
    EntryCreate:
      type: object
      additionalProperties: false
      required: [business_date, type, amount]
      description: |
        不接受 actor、family、折算值、汇率或权限字段。
        - 非退款：`leaf_category_id`、`currency` 必填；分类 kind 必须与类型对应（ADR-0002）。
        - 退款：`refund_of` 必填；`leaf_category_id`、`currency`、`payment_method` 必须省略，沿用原消费。
        - 支出必须有 `payment_method`；收入可选；不计收支类型必须省略。
      properties:
        business_date: { $ref: "#/components/schemas/BusinessDate" }
        type: { $ref: "#/components/schemas/EntryType" }
        leaf_category_id: { $ref: "#/components/schemas/Id" }
        currency: { $ref: "#/components/schemas/CurrencyCode" }
        amount: { $ref: "#/components/schemas/Amount" }
        note: { $ref: "#/components/schemas/Note" }
        payment_method:
          oneOf:
            - $ref: "#/components/schemas/PaymentMethod"
            - type: "null"
        attachment_ids:
          type: array
          maxItems: 3
          uniqueItems: true
          items: { $ref: "#/components/schemas/Id" }
        refund_of: { $ref: "#/components/schemas/Id" }
    EntryPatch:
      type: object
      additionalProperties: false
      required: [expected_version]
      description: 只提交变化字段。改日期或币种取新快照；改金额按原快照重算；其余保留快照。改为退款须同时提供 refund_of；退款不能改类型（ADR-0006）。
      properties:
        expected_version: { $ref: "#/components/schemas/Version" }
        business_date: { $ref: "#/components/schemas/BusinessDate" }
        type: { $ref: "#/components/schemas/EntryType" }
        leaf_category_id: { $ref: "#/components/schemas/Id" }
        currency: { $ref: "#/components/schemas/CurrencyCode" }
        amount: { $ref: "#/components/schemas/Amount" }
        note: { $ref: "#/components/schemas/Note" }
        payment_method:
          oneOf:
            - $ref: "#/components/schemas/PaymentMethod"
            - type: "null"
        attachment_ids:
          type: array
          maxItems: 3
          uniqueItems: true
          items: { $ref: "#/components/schemas/Id" }
        refund_of: { $ref: "#/components/schemas/Id" }
    FxSnapshot:
      type: object
      required: [requested_date, effective_date, provider, rates, fetched_at, manual]
      properties:
        requested_date: { $ref: "#/components/schemas/BusinessDate" }
        effective_date: { $ref: "#/components/schemas/BusinessDate" }
        provider: { type: string, examples: [ecb] }
        rates:
          type: object
          description: 原币、NZD、CNY 的 USD 基准精确值及来源
          additionalProperties:
            type: object
            required: [usd_value, source, revision]
            properties:
              usd_value: { $ref: "#/components/schemas/RateValue" }
              source: { type: string, enum: [provider, family_manual, base], description: "base 表示 USD 基准本身（恒为 1）" }
              revision: { type: integer }
        fetched_at: { $ref: "#/components/schemas/Timestamp" }
        manual: { type: boolean, description: 任一值来自家庭修正 }
    FxPreview:
      oneOf:
        - type: object
          required: [status, snapshot, display_amounts]
          properties:
            status: { const: ok }
            snapshot: { $ref: "#/components/schemas/FxSnapshot" }
            display_amounts: { $ref: "#/components/schemas/DisplayAmounts" }
            snapshot_changed:
              type: boolean
              description: 修改预览时，是否将更换快照
        - type: object
          required: [status, missing_currencies, searched_from, searched_to]
          properties:
            status: { const: rate_pending }
            missing_currencies:
              type: array
              items: { $ref: "#/components/schemas/CurrencyCode" }
            searched_from: { $ref: "#/components/schemas/BusinessDate" }
            searched_to: { $ref: "#/components/schemas/BusinessDate" }
    DisplayAmounts:
      type: object
      required: [amount, nzd, cny]
      properties:
        amount: { $ref: "#/components/schemas/Decimal" }
        nzd: { $ref: "#/components/schemas/Decimal" }
        cny: { $ref: "#/components/schemas/Decimal" }
    ResolvedCategory:
      type: object
      required: [leaf_id, leaf_name, parent_id, parent_name, kind, leaf_status]
      properties:
        leaf_id: { $ref: "#/components/schemas/Id" }
        leaf_name: { type: string }
        parent_id: { $ref: "#/components/schemas/Id" }
        parent_name: { type: string }
        kind: { $ref: "#/components/schemas/CategoryKind" }
        leaf_status: { type: string, enum: [active, disabled, deleted], description: deleted 为软删除（仅历史账目可见） }
        stored_leaf_id:
          description: 账目原引用的叶子（若经重定向）
          $ref: "#/components/schemas/Id"
    Entry:
      type: object
      required:
        - entry_id
        - family_id
        - business_date
        - type
        - category
        - currency
        - amount
        - payment_method
        - note
        - created_by
        - created_by_display
        - created_by_left
        - created_at
        - updated_at
        - source
        - version
        - state
        - fx_snapshot
        - nzd_minor
        - cny_minor
        - display_amounts
        - counts_in_stats
        - attachments
      properties:
        entry_id: { $ref: "#/components/schemas/Id" }
        family_id: { $ref: "#/components/schemas/Id" }
        business_date: { $ref: "#/components/schemas/BusinessDate" }
        type: { $ref: "#/components/schemas/EntryType" }
        category: { $ref: "#/components/schemas/ResolvedCategory" }
        currency: { $ref: "#/components/schemas/CurrencyCode" }
        amount: { $ref: "#/components/schemas/Decimal" }
        payment_method:
          oneOf:
            - $ref: "#/components/schemas/PaymentMethod"
            - type: "null"
        note: { type: string }
        created_by: { $ref: "#/components/schemas/Id" }
        created_by_display: { type: string }
        created_by_left: { type: boolean, description: 录入人已离开家庭（ADR-0006） }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        updated_at: { $ref: "#/components/schemas/Timestamp" }
        source: { $ref: "#/components/schemas/EntrySource" }
        version: { $ref: "#/components/schemas/Version" }
        state: { type: string, enum: [active, trashed] }
        deleted_at: { $ref: "#/components/schemas/Timestamp" }
        purge_after: { $ref: "#/components/schemas/Timestamp" }
        fx_snapshot: { $ref: "#/components/schemas/FxSnapshot" }
        nzd_minor: { type: integer }
        cny_minor: { type: integer }
        display_amounts: { $ref: "#/components/schemas/DisplayAmounts" }
        counts_in_stats: { type: boolean, description: false 表示“不计收支” }
        secondary:
          description: 明细列表中按家庭辅助币种折算的金额；未设置辅助币种或缺汇率时为 null（仅列表接口返回）
          oneOf:
            - type: "null"
            - type: object
              required: [currency, amount]
              properties:
                currency: { $ref: "#/components/schemas/CurrencyCode" }
                amount: { $ref: "#/components/schemas/Decimal" }
        refund_of: { $ref: "#/components/schemas/Id" }
        refund_ids:
          type: array
          items: { $ref: "#/components/schemas/Id" }
        refunded_amount: { $ref: "#/components/schemas/Decimal" }
        refundable_amount: { $ref: "#/components/schemas/Decimal" }
        receipt_group_id: { $ref: "#/components/schemas/Id" }
        attachments:
          type: array
          items:
            type: object
            required: [attachment_id, content_type]
            properties:
              attachment_id: { $ref: "#/components/schemas/Id" }
              content_type: { type: string }
        can_edit: { type: boolean, description: 当前调用者是否可修改／删除（仅供界面，服务端仍会检查） }
    EntryPage:
      type: object
      required: [items, data_version]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Entry" }
        next_cursor: { type: string }
        data_version: { type: string }
    EntryFilters:
      type: object
      additionalProperties: false
      properties:
        created_by: { $ref: "#/components/schemas/Id" }
        type: { $ref: "#/components/schemas/EntryType" }
        category_id: { $ref: "#/components/schemas/Id" }
        payment_method: { $ref: "#/components/schemas/PaymentMethod" }
    DeleteResult:
      type: object
      required: [entry_id, state, purge_after, version]
      properties:
        entry_id: { $ref: "#/components/schemas/Id" }
        state: { const: trashed }
        purge_after: { $ref: "#/components/schemas/Timestamp" }
        version: { $ref: "#/components/schemas/Version" }
        also_trashed:
          type: array
          description: 一并删除的关联退款 ID
          items: { $ref: "#/components/schemas/Id" }

    Dashboard:
      type: object
      required: [family_id, month, filters, data_version, computed_at, entry_count, totals, by_payment_method, category_pie]
      properties:
        family_id: { $ref: "#/components/schemas/Id" }
        month: { $ref: "#/components/schemas/Month" }
        filters: { $ref: "#/components/schemas/EntryFilters" }
        data_version: { type: string }
        computed_at: { $ref: "#/components/schemas/Timestamp" }
        entry_count: { type: integer }
        totals:
          type: object
          required: [income, expense_gross, refund, net_expense, balance]
          properties:
            income: { $ref: "#/components/schemas/MoneyPair" }
            expense_gross: { $ref: "#/components/schemas/MoneyPair" }
            refund: { $ref: "#/components/schemas/MoneyPair" }
            net_expense: { $ref: "#/components/schemas/MoneyPair" }
            balance:
              description: 总收入－净支出；不是银行余额
              $ref: "#/components/schemas/MoneyPair"
        by_payment_method:
          type: array
          items:
            type: object
            required: [payment_method, expense, refund, net, expense_count, refund_count]
            properties:
              payment_method: { $ref: "#/components/schemas/PaymentMethod" }
              expense: { $ref: "#/components/schemas/MoneyPair" }
              refund: { $ref: "#/components/schemas/MoneyPair" }
              net: { $ref: "#/components/schemas/MoneyPair" }
              expense_count: { type: integer }
              refund_count: { type: integer }
        secondary:
          description: 辅助币种合计（家庭未设置辅助币种时为 null）；missing_count 为缺汇率未计入的笔数
          oneOf:
            - type: "null"
            - type: object
              required: [currency, net_expense, net_expense_minor, by_payment_method, missing_count]
              properties:
                currency: { $ref: "#/components/schemas/CurrencyCode" }
                net_expense: { $ref: "#/components/schemas/Decimal" }
                net_expense_minor: { type: integer }
                missing_count: { type: integer }
                by_payment_method:
                  type: array
                  items:
                    type: object
                    required: [payment_method, net, net_minor]
                    properties:
                      payment_method: { $ref: "#/components/schemas/PaymentMethod" }
                      net: { $ref: "#/components/schemas/Decimal" }
                      net_minor: { type: integer }
        category_pie:
          type: object
          required: [currency, denominator_minor, denominator, slices, negatives, empty]
          properties:
            currency: { const: NZD }
            denominator_minor: { type: integer, description: 所有正净支出一级分类之和 }
            denominator: { $ref: "#/components/schemas/Decimal" }
            slices:
              type: array
              items:
                type: object
                required: [category_id, name, net_minor, net, share_percent]
                properties:
                  category_id: { $ref: "#/components/schemas/Id" }
                  name: { type: string }
                  net_minor: { type: integer }
                  net: { $ref: "#/components/schemas/Decimal" }
                  share_percent: { $ref: "#/components/schemas/Decimal" }
            negatives:
              type: array
              items:
                type: object
                required: [category_id, name, net_minor, net]
                properties:
                  category_id: { $ref: "#/components/schemas/Id" }
                  name: { type: string }
                  net_minor: { type: integer }
                  net: { $ref: "#/components/schemas/Decimal" }
            empty: { type: boolean }

    ExportJob:
      type: object
      required: [job_id, status, format, month]
      properties:
        job_id: { $ref: "#/components/schemas/Id" }
        status: { type: string, enum: [queued, running, ready, failed] }
        format: { type: string, enum: [csv, xlsx] }
        month: { $ref: "#/components/schemas/Month" }
        filters: { $ref: "#/components/schemas/EntryFilters" }
        row_count: { type: integer }
        download_url: { type: string, format: uri }
        download_expires_at: { $ref: "#/components/schemas/Timestamp" }

    ActionReceipt:
      type: object
      required: [action_id, kind, status, committed_at, results]
      properties:
        action_id: { type: string }
        kind: { type: string, description: 如 entry.create、batch.confirm }
        status: { const: committed }
        committed_at: { $ref: "#/components/schemas/Timestamp" }
        results:
          type: array
          items:
            type: object
            required: [object_type, object_id]
            properties:
              object_type: { type: string }
              object_id: { $ref: "#/components/schemas/Id" }
              version: { $ref: "#/components/schemas/Version" }
              purged: { type: boolean }

    # ── 分类 ──
    Category:
      type: object
      required: [category_id, kind, name, status, version, sort]
      properties:
        category_id: { $ref: "#/components/schemas/Id" }
        kind: { $ref: "#/components/schemas/CategoryKind" }
        parent_id: { $ref: "#/components/schemas/Id" }
        name: { $ref: "#/components/schemas/CategoryName" }
        status: { type: string, enum: [active, disabled] }
        redirect_to: { $ref: "#/components/schemas/Id" }
        sort: { type: integer }
        usage_count: { type: integer, description: 引用该叶子的有效＋回收站账目数 }
        version: { $ref: "#/components/schemas/Version" }
    CategoryTree:
      type: object
      required: [manifest_version, groups]
      properties:
        manifest_version: { type: integer }
        groups:
          type: array
          items:
            allOf:
              - $ref: "#/components/schemas/Category"
              - type: object
                required: [children]
                properties:
                  children:
                    type: array
                    items: { $ref: "#/components/schemas/Category" }

    # ── 币种与汇率 ──
    Currency:
      type: object
      additionalProperties: false
      required: [code, name_zh, minor_digits, provider_supported]
      properties:
        code: { $ref: "#/components/schemas/CurrencyCode" }
        name_zh: { type: string, minLength: 1, maxLength: 20 }
        minor_digits: { type: integer, enum: [0, 2, 3] }
        provider_supported: { type: boolean }
    ResolvedRates:
      oneOf:
        - type: object
          required: [status, requested_date, effective_date, rates]
          properties:
            status: { const: ok }
            requested_date: { $ref: "#/components/schemas/BusinessDate" }
            effective_date: { $ref: "#/components/schemas/BusinessDate" }
            rates:
              type: object
              additionalProperties:
                type: object
                required: [usd_value, source, revision]
                properties:
                  usd_value: { $ref: "#/components/schemas/RateValue" }
                  source: { type: string, enum: [provider, family_manual, base], description: "base 表示 USD 基准本身（恒为 1）" }
                  revision: { type: integer }
        - type: object
          required: [status, missing_currencies, searched_from, searched_to]
          properties:
            status: { const: rate_pending }
            missing_currencies:
              type: array
              items: { $ref: "#/components/schemas/CurrencyCode" }
            searched_from: { $ref: "#/components/schemas/BusinessDate" }
            searched_to: { $ref: "#/components/schemas/BusinessDate" }
    ManualRate:
      type: object
      required: [date, currency, usd_value, revision, entered_by, reason, entered_at]
      properties:
        date: { $ref: "#/components/schemas/BusinessDate" }
        currency: { $ref: "#/components/schemas/CurrencyCode" }
        usd_value: { $ref: "#/components/schemas/RateValue" }
        revision: { type: integer }
        entered_by: { $ref: "#/components/schemas/Id" }
        reason: { type: string }
        entered_at: { $ref: "#/components/schemas/Timestamp" }
    RecomputeJob:
      type: object
      required: [job_id, status, date_from, date_to]
      properties:
        job_id: { $ref: "#/components/schemas/Id" }
        status: { type: string, enum: [preparing, preview_ready, applying, done, failed, superseded] }
        date_from: { $ref: "#/components/schemas/BusinessDate" }
        date_to: { $ref: "#/components/schemas/BusinessDate" }
        preview_digest: { $ref: "#/components/schemas/Digest" }
        preview:
          type: object
          properties:
            entry_count: { type: integer }
            changed_count: { type: integer }
            months:
              type: array
              items:
                type: object
                required: [month, nzd_delta_minor, cny_delta_minor]
                properties:
                  month: { $ref: "#/components/schemas/Month" }
                  nzd_delta_minor: { type: integer }
                  cny_delta_minor: { type: integer }
            pending_currencies:
              type: array
              items: { $ref: "#/components/schemas/CurrencyCode" }
        applied_count: { type: integer }
        failure_code: { type: string }

    # ── 照片 ──
    UploadIntent:
      type: object
      required: [attachment_id, upload_url, fields, expires_at]
      properties:
        attachment_id: { $ref: "#/components/schemas/Id" }
        upload_url: { type: string, format: uri }
        fields:
          type: object
          additionalProperties: { type: string }
        expires_at: { $ref: "#/components/schemas/Timestamp" }
    Attachment:
      type: object
      required: [attachment_id, status, content_type, bytes]
      properties:
        attachment_id: { $ref: "#/components/schemas/Id" }
        status: { type: string, enum: [pending, ready, rejected] }
        content_type: { type: string }
        bytes: { type: integer }
        width: { type: integer }
        height: { type: integer }
        reject_reason: { type: string, enum: [format_mismatch, too_large, too_many_pixels, digest_mismatch, unreadable] }

    # ── AI ──
    RecognitionJob:
      type: object
      required: [job_id, status, created_at]
      properties:
        job_id: { $ref: "#/components/schemas/Id" }
        status: { type: string, enum: [received, queued, running, candidate_ready, failed] }
        batch_id: { $ref: "#/components/schemas/Id" }
        failure:
          type: object
          properties:
            class: { type: string, enum: [input_rejected, auth_error, permission_revoked, rate_limited, transport_error, timeout, protocol_error, schema_invalid, semantic_invalid, attempts_exhausted, internal], description: 见 ADR-0011 错误分类 }
            message: { type: string }
        created_at: { $ref: "#/components/schemas/Timestamp" }
    BatchSummary:
      type: object
      required: [batch_id, source, status, expires_at, candidate_count, version]
      properties:
        batch_id: { $ref: "#/components/schemas/Id" }
        source: { type: string, enum: [web_ai, feishu] }
        status: { type: string, enum: [open, closed, expired, cancelled] }
        expires_at: { $ref: "#/components/schemas/Timestamp" }
        candidate_count: { type: integer }
        version: { $ref: "#/components/schemas/Version" }
    Batch:
      allOf:
        - $ref: "#/components/schemas/BatchSummary"
        - type: object
          required: [candidates]
          properties:
            candidates:
              type: array
              maxItems: 10
              items: { $ref: "#/components/schemas/Candidate" }
            input_issues:
              type: array
              description: 整体输入问题（照片看不清、总额不明确、含指令性文字等）
              items: { type: string }
    FieldSource:
      type: string
      enum: [evidence, inferred, family_default, request_date, user]
      description: evidence=输入中有证据；inferred=推断需核对；family_default=使用家庭默认值；request_date=使用请求接收日；user=人工修改
    Candidate:
      type: object
      required: [candidate_id, batch_id, version, status, field_sources, missing_fields, needs_review, problems, content_digest]
      properties:
        candidate_id: { $ref: "#/components/schemas/Id" }
        batch_id: { $ref: "#/components/schemas/Id" }
        version: { $ref: "#/components/schemas/Version" }
        status: { type: string, enum: [ready, incomplete, needs_update, confirmed, deleted, expired] }
        type: { $ref: "#/components/schemas/EntryType" }
        business_date: { $ref: "#/components/schemas/BusinessDate" }
        currency: { $ref: "#/components/schemas/CurrencyCode" }
        amount:
          oneOf:
            - $ref: "#/components/schemas/Decimal"
            - type: "null"
        category: { $ref: "#/components/schemas/ResolvedCategory" }
        payment_method:
          oneOf:
            - $ref: "#/components/schemas/PaymentMethod"
            - type: "null"
        note: { type: string }
        field_sources:
          type: object
          additionalProperties: { $ref: "#/components/schemas/FieldSource" }
        missing_fields:
          type: array
          items: { type: string, enum: [amount, currency, business_date, category, payment_method, type] }
        needs_review:
          type: array
          items: { type: string }
        problems:
          type: array
          description: 如 category_inactive、rate_pending、refund_not_supported
          items: { type: string }
        receipt_group_id: { $ref: "#/components/schemas/Id" }
        attachment_id: { $ref: "#/components/schemas/Id" }
        fx_preview: { $ref: "#/components/schemas/FxPreview" }
        content_digest: { $ref: "#/components/schemas/Digest" }
        entry_id:
          description: 已确认时的正式账目 ID
          $ref: "#/components/schemas/Id"
    CandidatePatch:
      type: object
      additionalProperties: false
      required: [expected_version]
      properties:
        expected_version: { $ref: "#/components/schemas/Version" }
        type:
          type: string
          enum: [expense, income, internal_transfer, exchange, card_repayment, receivable]
          description: 候选不支持退款类型；退款请在网站从原消费发起
        business_date: { $ref: "#/components/schemas/BusinessDate" }
        currency: { $ref: "#/components/schemas/CurrencyCode" }
        amount: { $ref: "#/components/schemas/Amount" }
        leaf_category_id: { $ref: "#/components/schemas/Id" }
        payment_method:
          oneOf:
            - $ref: "#/components/schemas/PaymentMethod"
            - type: "null"
        note: { $ref: "#/components/schemas/Note" }
    ConfirmResult:
      type: object
      required: [action_id, status, entries]
      properties:
        action_id: { type: string }
        status: { const: committed }
        entries:
          type: array
          items:
            type: object
            required: [candidate_id, entry_id]
            properties:
              candidate_id: { $ref: "#/components/schemas/Id" }
              entry_id: { $ref: "#/components/schemas/Id" }

    # ── 费用 ──
    CostSummary:
      type: object
      required: [month, budget_nzd, thresholds, estimated, billed]
      properties:
        month: { $ref: "#/components/schemas/Month" }
        budget_nzd: { $ref: "#/components/schemas/Decimal" }
        thresholds:
          type: array
          items:
            type: object
            required: [percent, amount_nzd]
            properties:
              percent: { type: integer }
              amount_nzd: { $ref: "#/components/schemas/Decimal" }
        estimated:
          type: object
          required: [known_nzd, model_calls, unknown_usage_calls, as_of]
          properties:
            known_nzd: { $ref: "#/components/schemas/Decimal" }
            by_service:
              type: object
              additionalProperties: { $ref: "#/components/schemas/Decimal" }
            model_calls: { type: integer }
            unknown_usage_calls: { type: integer }
            price_verified_at: { $ref: "#/components/schemas/BusinessDate" }
            as_of: { $ref: "#/components/schemas/Timestamp" }
        billed:
          oneOf:
            - type: "null"
            - type: object
              required: [amount, currency, as_of, tag_coverage]
              properties:
                amount: { $ref: "#/components/schemas/Decimal" }
                currency: { $ref: "#/components/schemas/CurrencyCode" }
                as_of: { $ref: "#/components/schemas/Timestamp" }
                tag_coverage: { type: string, enum: [complete, partial, unknown] }
    Alert:
      type: object
      required: [alert_id, month, threshold_percent, basis, triggered_at, delivery]
      properties:
        alert_id: { $ref: "#/components/schemas/Id" }
        month: { $ref: "#/components/schemas/Month" }
        threshold_percent: { type: integer, enum: [80, 100] }
        basis: { type: string, enum: [estimate, billed] }
        triggered_at: { $ref: "#/components/schemas/Timestamp" }
        delivery:
          type: array
          items:
            type: object
            required: [channel, status, attempts]
            properties:
              channel: { type: string, enum: [feishu, email, admin_page] }
              status: { type: string, enum: [pending, sent, failed, unknown] }
              attempts: { type: integer }
